<div id="search-modal" class="search-modal">
  <div class="search-modal__overlay"></div>
  <div class="search-modal__content">
    <div class="search-modal__header">
      <div class="search-input-wrapper">
        <i class="fa fa-search search-icon"></i>
        <input type="text" id="search-input" placeholder="Search pages, publications, projects..." autocomplete="off">
      </div>
      <button id="search-close" class="search-close-btn">&times;</button>
    </div>
    <div class="search-modal__results" id="search-results">
      <div class="search-results-placeholder">Type to search...</div>
    </div>
  </div>
</div>
